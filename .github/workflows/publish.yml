name: Publish npm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'victorwads/figma-files-sync' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          # No registry-url/token placeholder: npm authenticates through OIDC.
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11
      - name: Validate tag and main ancestry
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          node --input-type=module -e 'import {readFileSync} from "node:fs"; const p=JSON.parse(readFileSync("package.json","utf8")); if(!/^[0-9]+[.][0-9]+[.][0-9]+$/.test(p.version) || process.env.RELEASE_REF!=="v"+p.version) throw new Error("Tag must equal v"+p.version+" (stable releases only)");'
          git merge-base --is-ancestor HEAD origin/main
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - run: npm run test:package
      - name: Pack verified release
        run: npm pack --pack-destination /tmp
      - name: Publish via npm Trusted Publishing (OIDC)
        run: |
          VERSION=$(node -p 'JSON.parse(require("fs").readFileSync("package.json","utf8")).version')
          npm publish "/tmp/figma-files-sync-${VERSION}.tgz" --access public --provenance --registry=https://registry.npmjs.org/
